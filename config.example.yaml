# Copier en config.yaml et adapter par client
site: https://exemple.fr
db: data/exemple.fr.db
gsc_property: sc-domain:exemple.fr      # ou https://exemple.fr/
credentials: credentials.json

crawl:
  max_pages: 5000
  concurrency: 10
  delay: 0.2
  render_js: false
  include_subdomains: false
  respect_robots: true

graph:
  ignore_zones: [nav, footer]   # PageRank éditorial

semantic:
  method: embedding             # tfidf | embedding
  model: intfloat/multilingual-e5-base
  top_k: 5
  min_score: 0.25

brief:
  model: claude-sonnet-4-6
